name: 📚 Reading Log Auto Backup

on:
  schedule:
    # 毎週日曜日 午前3時（JST = UTC-9）に実行
    # UTC時間で土曜日18:00 = JST日曜日3:00
    - cron: '0 18 * * 6'
  workflow_dispatch: # 手動実行も可能

jobs:
  backup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 全履歴を取得

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Create backup directory
        run: |
          mkdir -p backup
          echo "Backup directory created"

      - name: Generate backup filename with timestamp
        id: backup_file
        run: |
          TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')
          FILENAME="reading-log-backup_${TIMESTAMP}.json"
          echo "filename=${FILENAME}" >> $GITHUB_OUTPUT
          echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT
          echo "Backup filename: ${FILENAME}"

      - name: Create backup file
        run: |
          # バックアップファイルを作成
          # 実際のデータはブラウザのlocalStorageにあるため、
          # ここではテンプレートを作成
          cat > backup/${{ steps.backup_file.outputs.filename }} << 'EOF'
          {
            "backup_info": {
              "created_at": "${{ steps.backup_file.outputs.timestamp }}",
              "version": "1.0",
              "note": "このファイルはバックアップテンプレートです。実際のデータはWebアプリからエクスポートしてください。"
            },
            "books": [],
            "metadata": {
              "total_books": 0,
              "last_updated": "${{ steps.backup_file.outputs.timestamp }}"
            }
          }
          EOF
          
          echo "Backup file created: backup/${{ steps.backup_file.outputs.filename }}"

      - name: Delete backups older than 8 weeks
        run: |
          echo "Checking for backups older than 8 weeks..."
          
          # 8週間前の日付を計算（秒単位）
          CUTOFF_DATE=$(date -d '8 weeks ago' +%s)
          echo "Cutoff date (Unix timestamp): ${CUTOFF_DATE}"
          
          # backupディレクトリ内のファイルをチェック
          if [ -d "backup" ]; then
            for file in backup/reading-log-backup_*.json; do
              if [ -f "$file" ]; then
                # ファイル名から日付を抽出（reading-log-backup_YYYY-MM-DD_HH-MM-SS.json）
                filename=$(basename "$file")
                date_part=$(echo "$filename" | sed 's/reading-log-backup_\([0-9-]*\)_.*/\1/')
                
                # ファイルの日付をUnixタイムスタンプに変換
                file_date=$(date -d "$date_part" +%s 2>/dev/null || echo "0")
                
                # 8週間以上古いファイルを削除
                if [ "$file_date" != "0" ] && [ "$file_date" -lt "$CUTOFF_DATE" ]; then
                  echo "Deleting old backup: $file (Date: $date_part)"
                  rm "$file"
                else
                  echo "Keeping backup: $file (Date: $date_part)"
                fi
              fi
            done
          else
            echo "No backup directory found"
          fi

      - name: List remaining backups
        run: |
          echo "Remaining backup files:"
          ls -lh backup/ || echo "No backup files found"

      - name: Commit and push backups
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add backup/
          
          # 変更があるかチェック
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🔄 Auto backup: ${{ steps.backup_file.outputs.timestamp }}"
            git push
            echo "Backup committed and pushed successfully"
          fi

      - name: Create backup summary
        run: |
          echo "## 📊 Backup Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Backup Created:** ${{ steps.backup_file.outputs.filename }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp:** ${{ steps.backup_file.outputs.timestamp }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Backups:** $(ls -1 backup/*.json 2>/dev/null | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📁 Current Backups:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          ls -lh backup/*.json 2>/dev/null || echo "No backups found" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
