<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>読書記録</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            margin-top: 5px;
            font-size: 0.9em;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: 600;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .book-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            transition: transform 0.2s;
        }

        .book-item:hover {
            transform: translateX(5px);
        }

        .book-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
        }

        .book-title {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .book-author {
            color: #666;
            margin-bottom: 10px;
        }

        .book-meta {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .meta-item {
            font-size: 0.9em;
            color: #555;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .status-reading {
            background: #ffeaa7;
            color: #d63031;
        }

        .status-completed {
            background: #55efc4;
            color: #00b894;
        }

        .status-planned {
            background: #a29bfe;
            color: #6c5ce7;
        }

        .genre-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            margin-left: 10px;
        }

        .genre-novel {
            background: #ffeaa7;
            color: #fdcb6e;
        }

        .genre-self-help {
            background: #fab1a0;
            color: #e17055;
        }

        .genre-english {
            background: #81ecec;
            color: #00b894;
        }

        .genre-other {
            background: #dfe6e9;
            color: #636e72;
        }

        .book-notes {
            margin-top: 10px;
            padding: 10px;
            background: white;
            border-radius: 5px;
            font-size: 0.95em;
            color: #555;
        }

        .book-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-small {
            padding: 6px 15px;
            font-size: 0.9em;
            background: #ff7675;
        }

        .btn-small:hover {
            background: #d63031;
        }

        .btn-edit {
            padding: 6px 15px;
            font-size: 0.9em;
            background: #0984e3;
        }

        .btn-edit:hover {
            background: #0652a0;
        }

        .sort-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .sort-controls label {
            margin: 0;
            font-weight: 600;
            color: #555;
        }

        .sort-controls select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 2px solid #e0e0e0;
            font-size: 0.95em;
            cursor: pointer;
        }

        .edit-form {
            background: #fff3cd;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            border: 2px solid #ffc107;
        }

        .edit-form .form-group {
            margin-bottom: 10px;
        }

        .edit-form input,
        .edit-form textarea,
        .edit-form select {
            padding: 8px;
            font-size: 0.95em;
        }

        .edit-form button {
            margin-right: 10px;
            padding: 8px 20px;
            font-size: 0.9em;
        }

        .btn-cancel {
            background: #95a5a6;
        }

        .btn-cancel:hover {
            background: #7f8c8d;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .pagination button {
            padding: 8px 16px;
            background: #667eea;
            min-width: 40px;
        }

        .pagination button:disabled {
            background: #dfe6e9;
            cursor: not-allowed;
            color: #95a5a6;
        }

        .pagination .page-info {
            color: #555;
            font-weight: 600;
        }

        .items-per-page {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .items-per-page select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 2px solid #e0e0e0;
            font-size: 0.95em;
            width: auto;
        }

        .compact-view .book-item {
            padding: 15px;
        }

        .compact-view .book-title {
            font-size: 1.1em;
        }

        .compact-view .book-notes {
            max-height: 60px;
            overflow: hidden;
            position: relative;
        }

        .compact-view .book-notes::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 100%;
            height: 30px;
            background: linear-gradient(transparent, white);
        }

        .expand-notes {
            color: #667eea;
            cursor: pointer;
            font-size: 0.9em;
            margin-top: 5px;
            display: inline-block;
        }

        .expand-notes:hover {
            text-decoration: underline;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .rating {
            color: #ffd700;
            font-size: 1.2em;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.8em;
            }
            
            .stats {
                grid-template-columns: 1fr 1fr;
            }

            .sort-controls {
                flex-direction: column;
                align-items: stretch;
            }

            .sort-controls select {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1 style="margin: 0;">📚 <span id="app-title">読書記録</span></h1>
            <button onclick="toggleLanguage()" style="padding: 10px 20px; background: white; color: #667eea; border: 2px solid white; font-weight: bold;">
                <span id="lang-toggle">🌐 English</span>
            </button>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalBooks">0</div>
                <div class="stat-label">総冊数</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="completedBooks">0</div>
                <div class="stat-label">読了</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="readingBooks">0</div>
                <div class="stat-label">読書中</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="plannedBooks">0</div>
                <div class="stat-label">読みたい</div>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="novelBooks">0</div>
                <div class="stat-label">📖 小説</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="selfHelpBooks">0</div>
                <div class="stat-label">💡 自己啓発</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="englishBooks">0</div>
                <div class="stat-label">🌐 English</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="otherBooks">0</div>
                <div class="stat-label">📚 その他</div>
            </div>
        </div>

        <div class="card">
            <h2>新しい本を追加</h2>
            <form id="bookForm">
                <div class="form-group">
                    <label for="isbn">ISBN（自動入力）</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="isbn" placeholder="例: 9784101001098 または 978-4-10-100109-8">
                        <button type="button" onclick="fetchBookInfo()" style="padding: 12px 20px; white-space: nowrap;">📚 情報取得</button>
                    </div>
                    <small style="color: #666;">※ ISBNコード（13桁推奨）を入力して「情報取得」をクリック。書籍名・著者名が自動入力されます。</small>
                </div>
                <div class="form-group">
                    <label for="title">書籍名 *</label>
                    <input type="text" id="title" required>
                </div>
                <div class="form-group">
                    <label for="author">著者</label>
                    <input type="text" id="author">
                </div>
                <div class="form-group">
                    <label for="genre">ジャンル *</label>
                    <select id="genre" required>
                        <option value="novel">小説</option>
                        <option value="self-help">自己啓発</option>
                        <option value="english">English</option>
                        <option value="other">その他</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="url">URL（参考リンク）</label>
                    <input type="url" id="url" placeholder="https://example.com">
                </div>
                <div class="form-group">
                    <label for="status">ステータス *</label>
                    <select id="status" required>
                        <option value="reading">読書中</option>
                        <option value="completed">読了</option>
                        <option value="planned">読みたい</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="rating">評価（読了時）</label>
                    <select id="rating">
                        <option value="">未評価</option>
                        <option value="5">⭐⭐⭐⭐⭐</option>
                        <option value="4">⭐⭐⭐⭐</option>
                        <option value="3">⭐⭐⭐</option>
                        <option value="2">⭐⭐</option>
                        <option value="1">⭐</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="startDate">読み始めた日</label>
                    <input type="date" id="startDate">
                </div>
                <div class="form-group">
                    <label for="endDate">読み終わった日</label>
                    <input type="date" id="endDate">
                </div>
                <div class="form-group">
                    <label for="notes">メモ・感想</label>
                    <textarea id="notes" placeholder="本の感想や気づきを記録しましょう"></textarea>
                </div>
                <button type="submit">記録を追加</button>
            </form>
        </div>

        <div class="card">
            <h2>データ管理</h2>
            <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px;">
                <button onclick="exportData()" style="background: #00b894;">📥 データをエクスポート</button>
                <button onclick="document.getElementById('importFile').click()" style="background: #0984e3;">📤 データをインポート</button>
                <button onclick="clearAllData()" style="background: #d63031;">🗑️ 全データを削除</button>
            </div>
            <input type="file" id="importFile" accept=".json" style="display: none;" onchange="importData(event)">
            <p style="color: #666; font-size: 0.9em;">※ エクスポートでJSONファイルをダウンロードし、バックアップできます</p>
        </div>

        <div class="card">
            <h2>読書リスト</h2>
            <div class="items-per-page">
                <label>表示件数：</label>
                <select id="itemsPerPage" onchange="changeItemsPerPage()">
                    <option value="10">10件</option>
                    <option value="20" selected>20件</option>
                    <option value="50">50件</option>
                    <option value="all">すべて</option>
                </select>
            </div>
            <div class="sort-controls">
                <label>ジャンル：</label>
                <select id="filterGenre" onchange="filterAndSortBooks()">
                    <option value="all">すべて</option>
                    <option value="novel">📖 小説</option>
                    <option value="self-help">💡 自己啓発</option>
                    <option value="english">🌐 English</option>
                    <option value="other">📚 その他</option>
                </select>
                <label>並び替え：</label>
                <select id="sortBy" onchange="filterAndSortBooks()">
                    <option value="newest">新しい順</option>
                    <option value="oldest">古い順</option>
                    <option value="status">ステータス順</option>
                    <option value="rating">評価順（高→低）</option>
                    <option value="startDate">読み始めた日（新→古）</option>
                    <option value="endDate">読み終わった日（新→古）</option>
                    <option value="title">タイトル順（あいうえお）</option>
                </select>
            </div>
            <div id="bookList" class="compact-view"></div>
            <div class="pagination" id="pagination"></div>
        </div>
    </div>

    <script>
        let books = [];
        let useLocalStorage = false;
        let editingBookId = null;
        let currentPage = 1;
        let itemsPerPage = 20;
        let currentLanguage = 'ja'; // 'ja' or 'en'

        // 翻訳データ
        const translations = {

        // 翻訳テキストを取得
        function t(key) {
            return translations[currentLanguage][key] || key;
        }

        // 言語切り替え
        function toggleLanguage() {
            currentLanguage = currentLanguage === 'ja' ? 'en' : 'ja';
            localStorage.setItem('preferredLanguage', currentLanguage);
            updateUILanguage();
            filterAndSortBooks();
        }

        // UI言語を更新
        function updateUILanguage() {
            // ヘッダー
            document.getElementById('app-title').textContent = t('appTitle');
            document.getElementById('lang-toggle').textContent = t('langToggle');

            // 統計カード
            document.querySelectorAll('.stat-label')[0].textContent = t('totalBooks');
            document.querySelectorAll('.stat-label')[1].textContent = t('completedBooks');
            document.querySelectorAll('.stat-label')[2].textContent = t('readingBooks');
            document.querySelectorAll('.stat-label')[3].textContent = t('plannedBooks');
            document.querySelectorAll('.stat-label')[4].textContent = t('novelBooks');
            document.querySelectorAll('.stat-label')[5].textContent = t('selfHelpBooks');
            document.querySelectorAll('.stat-label')[6].textContent = t('englishBooks');
            document.querySelectorAll('.stat-label')[7].textContent = t('otherBooks');

            // フォームラベル（新規追加）
            const formLabels = document.querySelectorAll('.card h2');
            formLabels[0].textContent = t('addNewBook');
            formLabels[1].textContent = t('dataManagement');
            formLabels[2].textContent = t('readingList');

            // データ管理ボタン
            const dataButtons = document.querySelectorAll('.card')[1].querySelectorAll('button');
            dataButtons[0].textContent = t('exportData');
            dataButtons[1].textContent = t('importData');
            dataButtons[2].textContent = t('clearData');

            // フォーム項目
            updateFormLanguage();
            
            // フィルター・ソート
            updateFilterSortLanguage();
        }

        // ページ読み込み時にデータを取得
        async function loadBooks() {
            // 言語設定を読み込み
            const savedLang = localStorage.getItem('preferredLanguage');
            if (savedLang) {
                currentLanguage = savedLang;
            }
            updateUILanguage();

            // まずlocalStorageを試す
            try {
                const localData = localStorage.getItem('readingBooks');
                if (localData) {
                    books = JSON.parse(localData);
                    useLocalStorage = true;
                    filterAndSortBooks();
                    updateStats();
                    return;
                }
            } catch (error) {
                console.log('localStorage読み込みエラー:', error);
            }

            // window.storageを試す（利用可能な場合）
            if (window.storage) {
                try {
                    const result = await window.storage.get('books');
                    if (result && result.value) {
                        books = JSON.parse(result.value);
                        filterAndSortBooks();
                        updateStats();
                        return;
                    }
                } catch (error) {
                    console.log('Storage API利用不可、localStorageに切り替えます');
                    useLocalStorage = true;
                }
            } else {
                useLocalStorage = true;
            }

            // 初期表示
            filterAndSortBooks();
            updateStats();
        }

        // データを保存
        async function saveBooks() {
            // localStorageに保存
            try {
                localStorage.setItem('readingBooks', JSON.stringify(books));
            } catch (error) {
                console.error('localStorage保存エラー:', error);
            }

            // window.storageにも保存（利用可能な場合）
            if (window.storage && !useLocalStorage) {
                try {
                    await window.storage.set('books', JSON.stringify(books));
                } catch (error) {
                    console.log('Storage API保存エラー、localStorageを使用します');
                    useLocalStorage = true;
                }
            }
        }

        // ISBN情報取得
        async function fetchBookInfo() {
            const isbnInput = document.getElementById('isbn').value.trim();
            if (!isbnInput) {
                alert('ISBNを入力してください');
                return;
            }

            // ハイフンを除去
            const isbn = isbnInput.replace(/-/g, '').replace(/\s/g, '');
            
            // ISBNの妥当性チェック（10桁または13桁）
            if (isbn.length !== 10 && isbn.length !== 13) {
                alert('ISBNは10桁または13桁で入力してください');
                return;
            }

            const button = event.target;
            button.disabled = true;
            button.textContent = '取得中...';

            try {
                // Google Books APIで検索
                const response = await fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${isbn}&country=JP`);
                
                if (!response.ok) {
                    throw new Error('API接続エラー');
                }

                const data = await response.json();

                if (data.items && data.items.length > 0) {
                    const bookInfo = data.items[0].volumeInfo;
                    
                    // タイトル
                    if (bookInfo.title) {
                        document.getElementById('title').value = bookInfo.title;
                    }
                    
                    // 著者
                    if (bookInfo.authors && bookInfo.authors.length > 0) {
                        document.getElementById('author').value = bookInfo.authors.join(', ');
                    }
                    
                    // 説明（最初の300文字）
                    if (bookInfo.description) {
                        const description = bookInfo.description.replace(/<[^>]*>/g, ''); // HTMLタグを除去
                        const shortDesc = description.length > 300 
                            ? description.substring(0, 300) + '...' 
                            : description;
                        document.getElementById('notes').value = shortDesc;
                    }

                    alert('✓ 書籍情報を取得しました！');
                } else {
                    alert('❌ 書籍情報が見つかりませんでした。\n\n以下を確認してください：\n・ISBNが正しいか\n・13桁のISBN-13を使用しているか\n・書籍がGoogle Booksに登録されているか');
                }
            } catch (error) {
                console.error('ISBN取得エラー:', error);
                alert('❌ 書籍情報の取得に失敗しました。\n\nインターネット接続を確認してください。\nまたはISBNを手動で入力してください。');
            } finally {
                button.disabled = false;
                button.textContent = '📚 情報取得';
            }
        }

        // フォーム送信
        document.getElementById('bookForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const book = {
                id: Date.now(),
                title: document.getElementById('title').value,
                author: document.getElementById('author').value,
                genre: document.getElementById('genre').value,
                url: document.getElementById('url').value,
                status: document.getElementById('status').value,
                rating: document.getElementById('rating').value,
                startDate: document.getElementById('startDate').value,
                endDate: document.getElementById('endDate').value,
                notes: document.getElementById('notes').value,
                createdAt: new Date().toISOString()
            };

            books.unshift(book);
            await saveBooks();
            filterAndSortBooks();
            updateStats();
            this.reset();
        });

        // 本を削除
        async function deleteBook(id) {
            if (confirm('この記録を削除しますか？')) {
                books = books.filter(book => book.id !== id);
                await saveBooks();
                filterAndSortBooks();
                updateStats();
            }
        }

        // 本を編集モードに
        function editBook(id) {
            editingBookId = id;
            filterAndSortBooks();
        }

        // 編集をキャンセル
        function cancelEdit() {
            editingBookId = null;
            filterAndSortBooks();
        }

        // 本を更新
        async function updateBook(id) {
            const book = books.find(b => b.id === id);
            if (!book) return;

            book.title = document.getElementById(`edit-title-${id}`).value;
            book.author = document.getElementById(`edit-author-${id}`).value;
            book.genre = document.getElementById(`edit-genre-${id}`).value;
            book.url = document.getElementById(`edit-url-${id}`).value;
            book.status = document.getElementById(`edit-status-${id}`).value;
            book.rating = document.getElementById(`edit-rating-${id}`).value;
            book.startDate = document.getElementById(`edit-startDate-${id}`).value;
            book.endDate = document.getElementById(`edit-endDate-${id}`).value;
            book.notes = document.getElementById(`edit-notes-${id}`).value;

            editingBookId = null;
            await saveBooks();
            filterAndSortBooks();
            updateStats();
        }

        // 本のリストを表示

            const totalPages = Math.ceil(totalItems / itemsPerPageValue);

                currentPage = totalPages;
            }

            }

            const endIndex = startIndex + itemsPerPageValue;

                const statusText = {
                    'reading': t('statusReading'),
                    'completed': t('statusCompleted'),
                    'planned': t('statusPlanned')

                    'novel': t('novelBooks'),
                    'self-help': t('selfHelpBooks'),
                    'english': t('englishBooks'),
                    'other': t('otherBooks')
                };

                const genreClass = `genre-${book.genre || 'other'}`;
                const ratingStars = book.rating ? '⭐'.repeat(parseInt(book.rating)) : '';

                // 編集モードの場合

                    return `
                        <div class="book-item">
                            <div class="book-header">
                                <div class="book-title">${t('editing')}</div>
                            </div>
                            <div class="edit-form">
                                <div class="form-group">
                                    <label>${t('bookTitle')}</label>
                                    <input type="text" id="edit-title-${book.id}" value="${book.title}" required>
                                </div>
                                <div class="form-group">
                                    <label>${t('author')}</label>
                                    <input type="text" id="edit-author-${book.id}" value="${book.author || ''}">
                                </div>
                                <div class="form-group">
                                    <label>${t('genre')}</label>
                                    <select id="edit-genre-${book.id}">
                                        <option value="novel" ${book.genre === 'novel' ? 'selected' : ''}>${t('genreNovel')}</option>
                                        <option value="self-help" ${book.genre === 'self-help' ? 'selected' : ''}>${t('genreSelfHelp')}</option>
                                        <option value="english" ${book.genre === 'english' ? 'selected' : ''}>${t('genreEnglish')}</option>
                                        <option value="other" ${(!book.genre || book.genre === 'other') ? 'selected' : ''}>${t('genreOther')}</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>${t('url')}</label>
                                    <input type="url" id="edit-url-${book.id}" value="${book.url || ''}" placeholder="https://example.com">
                                </div>
                                <div class="form-group">
                                    <label>${t('status')}</label>
                                    <select id="edit-status-${book.id}">
                                        <option value="reading" ${book.status === 'reading' ? 'selected' : ''}>${t('statusReading')}</option>
                                        <option value="completed" ${book.status === 'completed' ? 'selected' : ''}>${t('statusCompleted')}</option>
                                        <option value="planned" ${book.status === 'planned' ? 'selected' : ''}>${t('statusPlanned')}</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>${t('rating')}</label>
                                    <select id="edit-rating-${book.id}">
                                        <option value="" ${!book.rating ? 'selected' : ''}>${t('ratingNone')}</option>
                                        <option value="5" ${book.rating === '5' ? 'selected' : ''}>⭐⭐⭐⭐⭐</option>
                                        <option value="4" ${book.rating === '4' ? 'selected' : ''}>⭐⭐⭐⭐</option>
                                        <option value="3" ${book.rating === '3' ? 'selected' : ''}>⭐⭐⭐</option>
                                        <option value="2" ${book.rating === '2' ? 'selected' : ''}>⭐⭐</option>
                                        <option value="1" ${book.rating === '1' ? 'selected' : ''}>⭐</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>${t('startDate')}</label>
                                    <input type="date" id="edit-startDate-${book.id}" value="${book.startDate || ''}">
                                </div>
                                <div class="form-group">
                                    <label>${t('endDate')}</label>
                                    <input type="date" id="edit-endDate-${book.id}" value="${book.endDate || ''}">
                                </div>
                                <div class="form-group">
                                    <label>${t('notes')}</label>
                                    <textarea id="edit-notes-${book.id}">${book.notes || ''}</textarea>
                                </div>

                return `

                                </div>
                                ${book.author ? `<div class="book-author">${t('authorLabel')} ${book.author}</div>` : ''}

                            <span class="status-badge ${statusClass}">${statusText[book.status]}</span>

        // ページネーション表示
        function renderPagination(totalPages, totalItems) {
            const pagination = document.getElementById('pagination');
            
            if (itemsPerPage === 'all' || totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }

            let html = `
                <button onclick="goToPage(1)" ${currentPage === 1 ? 'disabled' : ''}>«</button>
                <button onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>‹</button>
                <span class="page-info">${currentPage} / ${totalPages} ${t('pageInfo')}（${t('totalItems')}${totalItems}${t('itemsUnit')}）</span>
                <button onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>›</button>
                <button onclick="goToPage(${totalPages})" ${currentPage === totalPages ? 'disabled' : ''}>»</button>
            `;

            pagination.innerHTML = html;
        }

        // ページ移動
        function goToPage(page) {
            currentPage = page;
            filterAndSortBooks();
        }

        // 表示件数変更
        function changeItemsPerPage() {
            itemsPerPage = document.getElementById('itemsPerPage').value;
            currentPage = 1;
            filterAndSortBooks();
        }

        // メモの展開
        function toggleNotes(id) {
            const notesEl = document.getElementById(`notes-${id}`);
            if (notesEl.style.maxHeight) {
                notesEl.style.maxHeight = '';
                notesEl.nextElementSibling.textContent = t('readMore');
            } else {
                notesEl.style.maxHeight = 'none';
                notesEl.nextElementSibling.textContent = t('readLess');
            }
        }

        // 統計を更新
        function updateStats() {
            document.getElementById('totalBooks').textContent = books.length;
            document.getElementById('completedBooks').textContent = 
                books.filter(b => b.status === 'completed').length;
            document.getElementById('readingBooks').textContent = 
                books.filter(b => b.status === 'reading').length;
            document.getElementById('plannedBooks').textContent = 
                books.filter(b => b.status === 'planned').length;
            
            // ジャンル別統計
            document.getElementById('novelBooks').textContent = 
                books.filter(b => b.genre === 'novel').length;
            document.getElementById('selfHelpBooks').textContent = 
                books.filter(b => b.genre === 'self-help').length;
            document.getElementById('englishBooks').textContent = 
                books.filter(b => b.genre === 'english').length;
            document.getElementById('otherBooks').textContent = 
                books.filter(b => !b.genre || b.genre === 'other').length;
        }

        // 初期化
        loadBooks();

        // データをエクスポート
        function exportData() {
            if (books.length === 0) {
                alert('エクスポートするデータがありません');
                return;
            }

            const dataStr = JSON.stringify(books, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `読書記録_${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            alert('データをエクスポートしました！');
        }

        // データをインポート
        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const importedBooks = JSON.parse(e.target.result);
                    if (!Array.isArray(importedBooks)) {
                        throw new Error('無効なデータ形式です');
                    }

                    const confirmMsg = `現在の記録（${books.length}件）を上書きして、${importedBooks.length}件のデータをインポートしますか？`;
                    if (confirm(confirmMsg)) {
                        books = importedBooks;
                        await saveBooks();
                        filterAndSortBooks();
                        updateStats();
                        alert('データをインポートしました！');
                    }
                } catch (error) {
                    alert('データの読み込みに失敗しました。正しいファイルを選択してください。');
                    console.error(error);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // フィルター＆ソート機能
        function filterAndSortBooks() {
            const filterGenre = document.getElementById('filterGenre').value;
            const sortBy = document.getElementById('sortBy').value;

            // ジャンルでフィルター
            let filteredBooks = books;
            if (filterGenre !== 'all') {
                filteredBooks = books.filter(book => {
                    if (filterGenre === 'other') {
                        return !book.genre || book.genre === 'other';
                    }
                    return book.genre === filterGenre;
                });
            }

            // ソート
            filteredBooks.sort((a, b) => {
                switch(sortBy) {
                    case 'newest':
                        return new Date(b.createdAt) - new Date(a.createdAt);
                    
                    case 'oldest':
                        return new Date(a.createdAt) - new Date(b.createdAt);
                    
                    case 'status':
                        const statusOrder = { 'reading': 1, 'planned': 2, 'completed': 3 };
                        return (statusOrder[a.status] || 4) - (statusOrder[b.status] || 4);
                    
                    case 'rating':
                        const ratingA = parseInt(a.rating) || 0;
                        const ratingB = parseInt(b.rating) || 0;
                        return ratingB - ratingA;
                    
                    case 'startDate':
                        if (!a.startDate && !b.startDate) return 0;
                        if (!a.startDate) return 1;
                        if (!b.startDate) return -1;
                        return new Date(b.startDate) - new Date(a.startDate);
                    
                    case 'endDate':
                        if (!a.endDate && !b.endDate) return 0;
                        if (!a.endDate) return 1;
                        if (!b.endDate) return -1;
                        return new Date(b.endDate) - new Date(a.endDate);
                    
                    case 'title':
                        return a.title.localeCompare(b.title, 'ja');
                    
                    default:
                        return 0;
                }
            });

            renderBooks(filteredBooks);
        }

        // 全データを削除
        async function clearAllData() {
            if (books.length === 0) {
                alert('削除するデータがありません');
                return;
            }

            const confirmMsg = `本当に全ての記録（${books.length}件）を削除しますか？\nこの操作は取り消せません。`;
            if (confirm(confirmMsg)) {
                books = [];
                await saveBooks();
                filterAndSortBooks();
                updateStats();
                alert('全てのデータを削除しました');
            }
        }
    </script>
